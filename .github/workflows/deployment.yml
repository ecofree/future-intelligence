name: Disposable deployment and browser
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      recipient_certificate:
        description: 'Public PEM certificate to encrypt the one-time, non-experimental APED review'
        type: string
        required: true
permissions:
  contents: read
jobs:
  worker-egress:
    name: Candidate worker DNS and TLS
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.number == 12) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/terra-retest-integration' && github.run_attempt == 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check pilot and candidate TSA handshakes with empty provider keys
        run: |
          export FI_UID=$(id -u) FI_GID=$(id -g)
          python3 deploy/configure.py
          docker compose -f deploy/compose.yaml build worker-openai
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            docker compose -f deploy/compose.yaml run --rm -T --no-deps worker-openai python -m future_intelligence.runtime check-egress --additional-tsa-host timestamp.aped.gov.gr
          fi
      - name: Request one timestamp for the public revision and encrypt the exchange
        if: github.event_name == 'workflow_dispatch'
        env:
          RECIPIENT_CERTIFICATE: ${{ inputs.recipient_certificate }}
        run: |
          set -euo pipefail
          umask 077
          export FI_UID=$(id -u) FI_GID=$(id -g)
          review="$RUNNER_TEMP/tsa-review"
          mkdir "$review"
          printf '%s\n' "$RECIPIENT_CERTIFICATE" > "$RUNNER_TEMP/recipient.pem"
          openssl x509 -in "$RUNNER_TEMP/recipient.pem" -noout
          # Check encryption before issuing the single request.
          openssl cms -encrypt -binary -aes256 -in /dev/null -out /dev/null -outform DER "$RUNNER_TEMP/recipient.pem"
          code=0
          docker compose -f deploy/compose.yaml run --rm -T --no-deps -v "$review:/review" -e PUBLIC_REVISION="$GITHUB_SHA" worker-openai python - < deploy/probe_public_tsa.py || code=$?
          tar -C "$review" -cf - sample | openssl cms -encrypt -binary -aes256 -out "$RUNNER_TEMP/tsa-review.p7m" -outform DER "$RUNNER_TEMP/recipient.pem"
          exit "$code"
      - name: Retain only the encrypted review
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-tsa-review
          path: ${{ runner.temp }}/tsa-review.p7m
          retention-days: 1
          if-no-files-found: error
      - name: Stop the disposable candidate
        if: always()
        run: docker compose -f deploy/compose.yaml --profile live-openai down -v
  compose:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Generate disposable private secrets and start local deployment
        run: |
          echo "FI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "FI_GID=$(id -g)" >> "$GITHUB_ENV"
          export FI_UID=$(id -u) FI_GID=$(id -g)
          python deploy/configure.py
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml up --build -d web
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Re-run setup without changing credentials or migrations
        run: docker compose -f deploy/compose.yaml run --rm -T setup
      - name: Write synthetic records (no model or TSA network)
        run: docker compose -f deploy/compose.yaml run --rm -T -e FI_SYNTHETIC_DEPLOYMENT_TEST=1 setup python - < deploy/seed_smoke.py
      - name: Verify database failure is visible and restart recovers
        run: |
          docker compose -f deploy/compose.yaml stop db
          code=$(curl -s -o /tmp/fi-readiness.json -w '%{http_code}' http://127.0.0.1:8080/readyz)
          test "$code" = 503
          docker compose -f deploy/compose.yaml start db
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Restore backup into new database and compare all table contents
        run: |
          bash deploy/backup.sh /tmp/fi-private-backup
          FI_COMPARE_QUIESCENT=1 bash deploy/restore-drill.sh /tmp/fi-private-backup
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Actual Chromium workbench acceptance
        run: python deploy/browser_smoke.py
      - name: Safe startup diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml ps -a
          docker compose -f deploy/compose.yaml logs --tail 40 web setup
          docker compose -f deploy/compose.yaml exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=3).status)" || true
      - name: Stop only this disposable stack (no secret or research artifacts uploaded)
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
