name: Offline core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q future_intelligence tests
      - name: Offline demo (not a live forecast)
        run: |
          python -m future_intelligence > /tmp/fi-demo.json
          python - <<'PYCODE'
          import json, math
          from future_intelligence.core.commitments import record_hash
          with open('/tmp/fi-demo.json', encoding='utf-8') as stream:
              result = json.load(stream)
          assert result['content_integrity_valid'] is True
          assert result['external_timestamp_status'] == 'NOT_REQUESTED'
          assert result['commitment']['payload']['run_kind'] == 'MOCK_OFFLINE_DEMO'
          assert record_hash(result['commitment']) == result['record_hash']
          assert math.isclose(result['brier'], 0.09)
          PYCODE
      - name: Check legacy publishing script syntax only
        run: bash -n scripts/publish_github.sh
