name: PostgreSQL integrated ledger

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: fi_test
          POSTGRES_USER: postgres
          # Disposable CI-only password; never used by a deployment.
          POSTGRES_PASSWORD: fixture-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FI_TEST_DATABASE_URL: postgresql://postgres:fixture-only-ci-password@localhost:5432/fi_test
      FI_MIGRATION_DATABASE_URL: postgresql://postgres:fixture-only-ci-password@localhost:5432/fi_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install packaged database and workbench dependencies
        run: python -m pip install '.[postgres,web]'
      - name: Verify installed migration resource outside checkout
        working-directory: /tmp
        run: python -m future_intelligence.db.migrate
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Real database integration tests (missing database is failure)
        run: python -m unittest discover -s tests/integration -v
      - name: Write operational admission checkpoint
        run: python scripts/check_operation_persistence.py write /tmp/fi-operation-persistence.json
      - name: Write task ledger checkpoint
        run: python scripts/check_task_persistence.py write /tmp/fi-task-persistence.json
      - name: Write persistence checkpoint
        run: python scripts/check_persistence.py write /tmp/fi-persistence.json
      - name: Write evidence and provider checkpoint
        run: python scripts/check_provider_persistence.py write /tmp/fi-provider-persistence.json
      - name: Write integrated delivery checkpoint
        run: python scripts/check_delivery_persistence.py write /tmp/fi-delivery-persistence.json
      - name: Restart actual PostgreSQL server
        run: |
          docker restart '${{ job.services.postgres.id }}'
          for attempt in $(seq 1 30); do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -U postgres -d fi_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify rows after server restart
        run: python scripts/check_persistence.py verify /tmp/fi-persistence.json
      - name: Verify operational admission persistence and pause
        run: python scripts/check_operation_persistence.py verify /tmp/fi-operation-persistence.json
      - name: Verify evidence and provider persistence
        run: python scripts/check_provider_persistence.py verify /tmp/fi-provider-persistence.json
      - name: Verify integrated delivery persistence
        run: python scripts/check_delivery_persistence.py verify /tmp/fi-delivery-persistence.json
      - name: Verify task ledger and resume safe work
        run: python scripts/check_task_persistence.py verify /tmp/fi-task-persistence.json
      - name: Reapply migrations without changes
        run: python -m future_intelligence.db.migrate
